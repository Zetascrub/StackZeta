<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StackZeta Sign In</title><style>
:root{color-scheme:dark;--ink:#03131d;--cyan:#00e5f0;--cyan2:#00b8d4;--warm:#f4f0e4;--muted:#8aa7b4;--danger:#ff5a36}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 82% 0,#0b4052,var(--ink) 40%);color:var(--warm);font:15px/1.45 system-ui,sans-serif;padding:16px}form{width:min(380px,100%);background:#071e2de8;border:1px solid #12485a;border-radius:18px;padding:26px;display:grid;gap:14px}h1{margin:0;color:var(--cyan);letter-spacing:.06em;font-size:30px}p{margin:0;color:var(--muted)}label{display:grid;gap:6px;color:var(--muted);font-size:13px}input{width:100%;border:1px solid #1a5668;border-radius:9px;background:#021018;color:var(--warm);padding:10px 11px;font:inherit}button{border:0;border-radius:10px;background:var(--cyan2);color:#001319;padding:11px 16px;font-weight:750;cursor:pointer}#error{color:var(--danger);min-height:1.4em}
</style></head><body><form id="login"><h1>STACKZETA</h1><p>Sign in to the local control panel.</p><label>Password<input id="password" type="password" autocomplete="current-password" autofocus required></label><button type="submit">Sign in</button><span id="error"></span><p>First start? The generated password is in the bridge log: <code>docker logs notify-bridge | grep password</code></p></form>
<script>
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.ok)location.reload();else document.getElementById('error').textContent=await r.text()};
</script></body></html>
